<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Nspire-Lernpfad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one calm focus column. Home = chapter path. Lesson = exactly one step card, big next button, nothing else competing. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --soft:#F4F7F9; --ink:#14202E; --muted:#5A6676; --line:#D3DBE3;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --key:#283447; --key-ink:#F2F5F8; --lcd:#F3F8F5;
  --ok:#1B7A45; --ok-bg:#E1F3E8; --bad:#A8402B; --bad-bg:#FBEAE5; --warn:#7F5600; --warn-bg:#FBF0D6;
  --c1:#0B6E78; --c2:#B4582A; --fill:rgba(11,110,120,.16);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --base:17px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202B; --soft:#1D2734; --ink:#E6EBF1; --muted:#9CA8B7; --line:#2B3747;
  --accent:#53C2CB; --accent-ink:#062428; --accent-soft:#163238;
  --key:#3A4860; --key-ink:#EEF2F7; --lcd:#121C1E;
  --ok:#62D398; --ok-bg:#132E20; --bad:#FF8E78; --bad-bg:#3A1C16; --warn:#F1C063; --warn-bg:#33280F;
  --c1:#53C2CB; --c2:#F0A070; --fill:rgba(83,194,203,.2);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --soft:#1D2734; --ink:#E6EBF1; --muted:#9CA8B7; --line:#2B3747;
  --accent:#53C2CB; --accent-ink:#062428; --accent-soft:#163238;
  --key:#3A4860; --key-ink:#EEF2F7; --lcd:#121C1E;
  --ok:#62D398; --ok-bg:#132E20; --bad:#FF8E78; --bad-bg:#3A1C16; --warn:#F1C063; --warn-bg:#33280F;
  --c1:#53C2CB; --c2:#F0A070; --fill:rgba(83,194,203,.2);
  color-scheme:dark }
:root[data-size="l"]{--base:19px} :root[data-size="xl"]{--base:21px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit}
code{font-family:var(--f-mono);font-size:.88em;background:var(--lcd);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
kbd{font-family:var(--f-mono);font-size:.8em;font-weight:600;background:var(--key);color:var(--key-ink);border-radius:6px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap;display:inline-block;line-height:1.5}
strong{font-weight:700}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.timer-time{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* home */
.hero{display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-.01em}
.hero p{max-width:56ch;color:var(--muted)}
.big{border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 22px;font-weight:700;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;gap:10px;justify-content:center}
.big.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.big:disabled{opacity:.45;cursor:default}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem}
.howto b{display:block;font-family:var(--f-display);font-size:1rem;margin-bottom:2px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.path li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative}
.path li:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:-4px;width:2px;background:var(--line)}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.node.part{border-color:var(--accent);color:var(--accent)}
.node.full{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chap{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:6px 12px 22px;border-radius:10px;min-width:0}
.chap:hover .chap-title{color:var(--accent)}
.chap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chap-title{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.chap-meta{font-size:.85rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.minibar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:260px}
.minibar span{display:block;height:100%;background:var(--accent)}

/* lesson */
.lesson-top{display:flex;flex-direction:column;gap:10px}
.lesson-top .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:10px;border-radius:5px;border:none;background:var(--line);cursor:pointer;padding:0}
.dot.done{background:var(--ok)}
.dot.cur{background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.card.solved{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.type{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.type.info{background:var(--accent-soft);color:var(--accent)}
.type.do{background:var(--warn-bg);color:var(--warn)}
.card h2{font-size:clamp(1.35rem,4.5vw,1.65rem);font-weight:800}
.body{display:flex;flex-direction:column;gap:12px;max-width:60ch}
.body ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.keypath{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:12px}
.keypath .arrow{color:var(--muted);font-weight:700}
.keypath .menu{font-size:.88rem;border:1px dashed var(--muted);border-radius:6px;padding:1px 8px}
.merke{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 14px}
.merke b{color:var(--accent)}
.try{display:flex;flex-direction:column;gap:10px;background:var(--warn-bg);border-radius:12px;padding:12px 14px}
.try .label{font-weight:700;color:var(--warn)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;align-self:flex-start;border:2px solid var(--warn);color:var(--warn);background:transparent;border-radius:10px;padding:6px 12px}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.plot{width:100%;max-width:420px;height:auto;align-self:center}
.plot .ax{stroke:var(--muted);stroke-width:1}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.plot .lab{font-family:var(--f-body);font-size:12px;font-weight:700}
.plot .f1{stroke:var(--c1);fill:none;stroke-width:2.5}
.plot .f2{stroke:var(--c2);fill:none;stroke-width:2.5}
.plot .l1{fill:var(--c1)} .plot .l2{fill:var(--c2)}
.plot .area{fill:var(--fill);stroke:none}
.plot .pt{fill:var(--ink)}
.plot .ptl{fill:var(--ink);font-family:var(--f-body);font-size:12px;font-weight:700}
.docmap{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.docmap .doc{border:2px solid var(--accent);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1 1 260px}
.docmap .pages{display:flex;gap:8px;flex-wrap:wrap}
.docmap .pg{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem;flex:1 1 100px}
.docmap .pg b{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* interactive */
.q{font-size:1.08rem;font-weight:700;max-width:60ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .l{font-family:var(--f-mono);font-weight:700;color:var(--muted);width:1.4em;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.75}
.opt:disabled{cursor:default}
.order-pool,.order-done{display:flex;flex-direction:column;gap:8px}
.order-done:empty{display:none}
.order-done .item{border:2px solid var(--ok);background:var(--ok-bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px}
.order-done .item b{font-family:var(--f-mono);color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.part{display:flex;flex-direction:column;gap:8px}
.part label{font-weight:700}
.part .sub{font-weight:400;color:var(--muted)}
.entry{display:flex;gap:8px;flex-wrap:wrap}
.entry input{flex:1 1 200px;min-width:0;font-family:var(--f-mono);font-size:1rem;color:var(--ink);background:var(--lcd);border:2px solid var(--line);border-radius:10px;padding:11px 12px}
.entry input:focus{outline:none;border-color:var(--accent)}
.part.ok input{border-color:var(--ok)}
.part.bad input{border-color:var(--bad)}
.btn{border-radius:10px;padding:10px 16px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.syms{display:flex;gap:6px;flex-wrap:wrap}
.sym{font-family:var(--f-mono);font-size:.85rem;min-width:38px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);cursor:pointer}
.fb{border-radius:10px;padding:9px 12px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb .ex{display:block;font-weight:400;margin-top:4px;color:var(--ink)}
.helpers{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.panel{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.panel h3{font-family:var(--f-body);font-size:.95rem}
.panel ol{margin:0;padding-left:1.3em}

.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.navrow .big{flex:1 1 auto;max-width:320px}
.navrow .big.ghost{flex:0 1 auto}
.hint{font-size:.82rem;color:var(--muted);text-align:center}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.banner .x{border:2px solid var(--warn);background:transparent;color:var(--warn);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}

/* done */
.done-card{text-align:left}
.done-badge{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.done-badge svg{width:34px;height:34px;stroke:var(--surface);stroke-width:4;fill:none}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.shake,.pop{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* =========================================================
   INHALT – Kapitel und Schritte
   Text-Markup: «menu» = Taste, `code` = Eingabe, **fett**
   ========================================================= */
const R3=Math.sqrt(3);
const CH=[
{id:"start",title:"Los geht's",min:5,goal:"Du findest dich auf dem Rechner zurecht.",
 merke:["Der Rechner arbeitet mit Dokumenten. Jede Seite hat eine App.","Fast alle Befehle findest du über «menu».","Für Sinus und Kosinus in der Analysis: Bogenmaß. Für Winkel in Grad: Grad."],
 steps:[
 {t:"info",h:"Der Rechner ist wie ein Heft",b:"<p>Ein **Dokument** ist wie ein Heft. Darin gibt es **Seiten**. Auf jeder Seite läuft genau eine **App**.</p>",
  docmap:true,
  merke:"Calculator = rechnen. Graphs = zeichnen."},
 {t:"info",h:"Diese 5 Tasten brauchst du ständig",b:"<div class='tbl'><table><tr><th>Taste</th><th>Was sie macht</th></tr><tr><td>«⌂»</td><td>Startbildschirm</td></tr><tr><td>«menu»</td><td>Alle Befehle der App</td></tr><tr><td>«enter»</td><td>Ausrechnen, bestätigen</td></tr><tr><td>«esc»</td><td>Abbrechen, zurück</td></tr><tr><td>«tab»</td><td>Zum nächsten Feld springen</td></tr></table></div><p>Mit dem **Touchpad** (die runde Fläche) bewegst du den Zeiger. Drück in die Mitte, um zu klicken.</p>"},
 {t:"mc",q:"Du suchst einen Befehl, zum Beispiel um eine Gleichung zu lösen. Welche Taste drückst du zuerst?",o:["«⌂»","«menu»","«tab»","«esc»"],c:1,ex:"Im «menu» stehen alle Befehle der App, die gerade offen ist."},
 {t:"info",h:"Dein erstes Dokument",b:"<p>So legst du ein neues Dokument mit Calculator an:</p>",keys:["«⌂»","Neu","Calculator hinzufügen"],
  try:"Mach es jetzt an deinem Rechner. Tippe dann `2+3` und drück «enter»."},
 {t:"order",q:"Bring die Schritte in die richtige Reihenfolge. Tippe sie nacheinander an.",items:["«⌂» drücken","Neu wählen","Calculator hinzufügen","`2+3` eintippen","«enter» drücken"],ex:"Genau so. Speichern kannst du danach mit «ctrl» «S»."},
 {t:"info",h:"Zwei Einstellungen, die oft Ärger machen",b:"<p>Öffne: «⌂» → Einstellungen → Dokumenteinstellungen.</p><ul><li>**Winkel:** Für Analysis **Bogenmaß**. Für Dreiecke und Winkel in Grad **Grad**.</li><li>**Auto oder Näherung:** Stell **Auto** ein. Dann bekommst du exakte Ergebnisse wie √2.</li></ul>",
  merke:"Falsche Winkel-Einstellung ist einer der häufigsten Fehler."},
 {t:"mc",q:"Du rechnest sin(30) und willst 0,5 als Ergebnis. Was muss eingestellt sein?",o:["Bogenmaß","Grad","Näherung","Egal"],c:1,ex:"sin(30°) = 0,5. Im Bogenmaß bedeutet 30 aber 30 rad, und das ergibt etwas ganz anderes."}
 ]},

{id:"rechnen",title:"Rechnen im Calculator",min:8,goal:"Du rechnest exakt und als Dezimalzahl und formst Terme um.",
 merke:["«enter» = exakt, «ctrl» «enter» = Dezimalzahl.","Kommazahlen mit Punkt: `2.5`. Das Komma trennt Angaben in Befehlen.","`factor` macht ein Produkt, `expand` multipliziert aus."],
 steps:[
 {t:"info",h:"Exakt oder Dezimalzahl?",b:"<p>Der Rechner rechnet **exakt**, wenn du «enter» drückst. Für eine **Dezimalzahl** drückst du «ctrl» «enter».</p><div class='tbl'><table><tr><th>Eingabe</th><th>«enter»</th><th>«ctrl» «enter»</th></tr><tr><td>`√(8)`</td><td>2·√2</td><td>2.82843</td></tr><tr><td>`1/3+1/4`</td><td>7/12</td><td>0.583333</td></tr></table></div>"},
 {t:"mc",q:"Du tippst `√(8)` und drückst «enter». Was zeigt der Rechner?",o:["2.82843","2·√2","8","Fehler"],c:1,ex:"«enter» gibt das exakte Ergebnis. Die Dezimalzahl bekommst du mit «ctrl» «enter»."},
 {t:"task",q:"Jetzt du: Berechne √50.",parts:[{label:"√50 =",kind:"num",ans:Math.sqrt(50),tol:.001,ph:"exakt oder als Dezimalzahl"}],tip:["Tippe `√(50)`. Das √ findest du über «ctrl» «x²».","Dann «enter» für exakt oder «ctrl» «enter» für die Dezimalzahl."],sol:"<p>5·√2 ≈ 7,0711</p>"},
 {t:"info",h:"Punkt statt Komma",b:"<p>Der Rechner schreibt Kommazahlen mit **Punkt**: `2.5` statt 2,5.</p><p>Das **Komma** trennt Angaben in einem Befehl, zum Beispiel `solve(x^2=4, x)`.</p>",merke:"Komma in einer Zahl = Fehlermeldung."},
 {t:"task",q:"Berechne 2/3 + 5/4.",parts:[{label:"Ergebnis",kind:"num",ans:23/12,tol:.001,ph:"z. B. 7/12"}],tip:["Tippe `2/3+5/4` und «enter».","Der Rechner zeigt einen Bruch. Den kannst du so eingeben."],sol:"<p>23/12 ≈ 1,9167</p>"},
 {t:"info",h:"Terme umformen",b:"<p>Du findest beides unter «menu» → Algebra.</p><ul><li>`factor` macht aus einer Summe ein **Produkt**: `factor(x^2-4)` → (x−2)·(x+2)</li><li>`expand` multipliziert **aus**: `expand((x+1)^2)` → x²+2x+1</li></ul>",keys:["«menu»","Algebra","Faktorisieren / Entwickeln"]},
 {t:"task",q:"Faktorisiere x² − 5x + 6.",parts:[{label:"Ergebnis",kind:"expr",ans:"x^2-5x+6",req:"factored",ph:"z. B. (x-…)(x-…)"}],tip:["`factor(x^2-5x+6)` und «enter»."],sol:"<p>(x − 2)·(x − 3)</p>"},
 {t:"task",q:"Multipliziere (2x − 1)³ aus.",parts:[{label:"Ergebnis",kind:"expr",ans:"(2x-1)^3",req:"expanded",ph:"z. B. 8x^3-…"}],tip:["`expand((2x-1)^3)` und «enter».","Hochzahlen tippst du mit `^`."],sol:"<p>8x³ − 12x² + 6x − 1</p>"},
 {t:"info",h:"Funktionen und Werte speichern",b:"<p>**Funktion festlegen:** `define f(x)=x^2-4x+3`. Danach kannst du `f(2)` rechnen.</p><p>**Zahl speichern:** `a:=5`. Das Zeichen `:=` bekommst du mit «ctrl» «var».</p>"},
 {t:"mc",q:"Welche Eingabe legt eine Funktion fest, die der Rechner sich merkt?",o:["`f(x)=x^2`","`define f(x)=x^2`","`solve(f(x)=x^2)`","`x^2`"],c:1,ex:"Erst mit `define` merkt sich der Rechner die Funktion."}
 ]},

{id:"gleichungen",title:"Gleichungen lösen",min:8,goal:"Du löst Gleichungen und Gleichungssysteme mit solve.",
 merke:["`solve(Gleichung, Variable)`: die Variable nie vergessen.","Systeme: Gleichungen mit `and` verbinden, Variablen in `{x,y}`.","Findet solve nichts, hilft `nSolve`."],
 steps:[

/* =========================================================
   PRÜFER für Eingaben
   ========================================================= */
function normz(s){return s.trim().toLowerCase().replace(/[−–]/g,"-").replace(/[·×⋅]/g,"*").replace(/÷/g,"/").replace(/π/g,"pi").replace(/²/g,"^2").replace(/³/g,"^3").replace(/(\d),(\d)/g,"$1.$2")}
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];
  if(c===" "){i++;continue}
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw 0;t.push({t:"num",v});i=j;continue}
  if(c==="√"){t.push({t:"fn",v:"sqrt"});i++;continue}
  if(/[a-z]/.test(c)){const m=s.slice(i).match(/^(sqrt|wurzel|ln|log|exp|sin|cos|tan|pi|e|x)/);if(!m)throw 0;const w=m[1];
    if(w==="pi")t.push({t:"num",v:Math.PI});else if(w==="e")t.push({t:"num",v:Math.E});else if(w==="x")t.push({t:"x"});else t.push({t:"fn",v:w==="wurzel"?"sqrt":w});i+=w.length;continue}
  if("+-*/^()".includes(c)){t.push({t:c});i++;continue}
  throw 0}return t}
const FN={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,exp:Math.exp,sin:Math.sin,cos:Math.cos,tan:Math.tan};
function parse(str){const tk=tokenize(str);let p=0;const peek=()=>tk[p],eat=t=>{if(tk[p]&&tk[p].t===t){p++;return true}return false};
  const startsAtom=k=>k&&(k.t==="num"||k.t==="x"||k.t==="fn"||k.t==="(");
  function expr(){let f=term();while(peek()&&(peek().t==="+"||peek().t==="-")){const op=tk[p++].t,a=f,b=term();f=op==="+"?x=>a(x)+b(x):x=>a(x)-b(x)}return f}
  function term(){let f=unary();for(;;){const k=peek();if(k&&(k.t==="*"||k.t==="/")){p++;const a=f,b=unary();f=k.t==="*"?x=>a(x)*b(x):x=>a(x)/b(x)}else if(startsAtom(k)){const a=f,b=power();f=x=>a(x)*b(x)}else break}return f}
  function unary(){if(eat("-")){const a=unary();return x=>-a(x)}if(eat("+"))return unary();return power()}
  function power(){const a=atom();if(eat("^")){const b=unary();return x=>Math.pow(a(x),b(x))}return a}
  function atom(){const k=tk[p++];if(!k)throw 0;if(k.t==="num"){const v=k.v;return()=>v}if(k.t==="x")return x=>x;
    if(k.t==="fn"){const g=FN[k.v],a=power();return x=>g(a(x))}if(k.t==="("){const a=expr();if(!eat(")"))throw 0;return a}throw 0}
  const f=expr();if(p!==tk.length)throw 0;return f}
function value(s){s=normz(s);let pct=false;if(s.endsWith("%")){pct=true;s=s.slice(0,-1).trim()}if(!s)return null;
  try{const v=parse(s)(0);if(!isFinite(v))return null;return pct?v/100:v}catch(e){return null}}
function listv(s){let r=s.trim();if(/[|;]/.test(r)&&/^[a-zA-Z]*\s*\(/.test(r)&&/\)\s*$/.test(r))r=r.replace(/^[a-zA-Z]*\s*\(/,"").replace(/\)\s*$/,"");
  let parts=/[;|]/.test(r)?r.split(/[;|]|\boder\b|\bund\b/):r.split(/,|\boder\b|\bund\b/);
  parts=parts.map(x=>x.replace(/^\s*[a-z]\s*=\s*/i,"")).filter(x=>x.trim()!=="");
  const v=parts.map(value);return v.some(x=>x===null)?null:v}
const close=(a,b,t)=>Math.abs(a-b)<=t;
function check(part,raw){
  if(!raw.trim())return{s:"warn",m:"Gib zuerst ein Ergebnis ein."};
  if(part.kind==="num"){const v=value(raw.replace(/^\s*[a-z]\s*=\s*/i,""));
    if(v===null)return{s:"warn",m:"Das kann ich nicht lesen. Schreib nur eine Zahl oder einen Term wie 5√2."};
    if(close(v,part.ans,part.tol))return{s:"ok"};
    for(const mi of part.miss||[])if(close(v,mi.v,part.tol*1.5))return{s:"bad",m:mi.m};
    return{s:"bad",m:"Noch nicht. Prüf deine Eingabe am Rechner oder schau dir den Tipp an."}}
  if(part.kind==="set"||part.kind==="tuple"){const v=listv(raw);
    if(!v)return{s:"warn",m:"Das kann ich nicht lesen. Trenn mehrere Werte mit einem Semikolon, z. B. -1; 2,5"};
    if(v.length!==part.ans.length)return{s:"bad",m:`Gesucht sind ${part.ans.length} Werte. Du hast ${v.length} eingegeben.`};
    if(part.kind==="tuple"){if(v.every((x,i)=>close(x,part.ans[i],part.tol)))return{s:"ok"};
      const so=a=>[...a].sort((p,q)=>p-q);if(so(v).every((x,i)=>close(x,so(part.ans)[i],part.tol)))return{s:"bad",m:"Die Werte stimmen, aber die Reihenfolge nicht."};
      return{s:"bad",m:"Noch nicht. Prüf jeden Wert einzeln."}}
    const left=[...part.ans];for(const x of v){const i=left.findIndex(a=>close(a,x,part.tol));if(i<0)return{s:"bad",m:"Mindestens ein Wert stimmt noch nicht."};left.splice(i,1)}
    return{s:"ok"}}
  if(part.kind==="expr"){let f,g;
    try{f=parse(normz(raw.replace(/^\s*[a-z]′?'?\(x\)\s*=\s*/i,"")));g=parse(normz(part.ans))}catch(e){return{s:"warn",m:"Das kann ich nicht lesen. Benutz x, ^ für Hochzahlen und * zum Malnehmen."}}
    const xs=[-1.7,-.6,.35,1.3,2.45,3.1];
    if(!xs.every(x=>{const a=f(x),b=g(x);return isFinite(a)&&Math.abs(a-b)<=1e-6*Math.max(1,Math.abs(b))}))return{s:"bad",m:"Der Term ist nicht gleichwertig. Prüf Vorzeichen und Hochzahlen."};
    const opens=(raw.match(/\(/g)||[]).length;
    if(part.req==="factored"&&opens<2)return{s:"warn",m:"Der Term stimmt, ist aber noch kein Produkt. Schreib ihn mit Klammern."};
    if(part.req==="expanded"&&opens>0)return{s:"warn",m:"Der Term stimmt, aber es sind noch Klammern drin. Multiplizier ganz aus."};
    return{s:"ok"}}
}

const md=s=>s.replace(/«([^»]+)»/g,"<kbd>$1</kbd>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const PRAISE=["Richtig!","Stark!","Genau so!","Super gemacht!","Treffer!","Sitzt!"];

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
  if(r.every((x,i)=>x===a[i])&&r.length>1)[r[0],r[1]]=[r[1],r[0]];return r}

function plotSVG(P){
  const W=340,H=230,m=24;
  const sx=x=>m+(x-P.xr[0])/(P.xr[1]-P.xr[0])*(W-2*m), sy=y=>H-m-(y-P.yr[0])/(P.yr[1]-P.yr[0])*(H-2*m);
  let g="";
  for(let x=Math.ceil(P.xr[0]);x<=P.xr[1];x++){g+=`<line class="grid" x1="${sx(x)}" y1="${m}" x2="${sx(x)}" y2="${H-m}"/>`;if(x!==0)g+=`<text x="${sx(x)}" y="${sy(0)+13}" text-anchor="middle">${x}</text>`}
  for(let y=Math.ceil(P.yr[0]);y<=P.yr[1];y++){g+=`<line class="grid" x1="${m}" y1="${sy(y)}" x2="${W-m}" y2="${sy(y)}"/>`;if(y!==0)g+=`<text x="${sx(0)-5}" y="${sy(y)+3}" text-anchor="end">${y}</text>`}
  g+=`<line class="ax" x1="${m}" y1="${sy(0)}" x2="${W-m}" y2="${sy(0)}"/><line class="ax" x1="${sx(0)}" y1="${m}" x2="${sx(0)}" y2="${H-m}"/>`;
  g+=`<text x="${W-m+4}" y="${sy(0)+4}">x</text><text x="${sx(0)+5}" y="${m-6}">y</text>`;
  const clipY=y=>Math.max(P.yr[0]-1,Math.min(P.yr[1]+1,y));
  if(P.area){const a=P.area,ft=P.fns[a.top].f,fb=P.fns[a.bot].f;let d="";const n=60;
    for(let i=0;i<=n;i++){const x=a.a+(a.b-a.a)*i/n;d+=(i?"L":"M")+sx(x).toFixed(1)+","+sy(ft(x)).toFixed(1)}
    for(let i=n;i>=0;i--){const x=a.a+(a.b-a.a)*i/n;d+="L"+sx(x).toFixed(1)+","+sy(fb(x)).toFixed(1)}
    g+=`<path class="area" d="${d}Z"/>`}
  P.fns.forEach((F,k)=>{let d="",n=160,last=null;
    for(let i=0;i<=n;i++){const x=P.xr[0]+(P.xr[1]-P.xr[0])*i/n,y=F.f(x);d+=(i?"L":"M")+sx(x).toFixed(1)+","+sy(clipY(y)).toFixed(1);if(y>=P.yr[0]&&y<=P.yr[1])last=[x,y]}
    g+=`<path class="f${F.c}" d="${d}"/>`;
    if(last)g+=`<text class="lab l${F.c}" x="${Math.min(sx(last[0])+4,W-m-8)}" y="${sy(last[1])-6}">${F.lab}</text>`});
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph"><defs><clipPath id="cp"><rect x="${m}" y="${m}" width="${W-2*m}" height="${H-2*m}"/></clipPath></defs><g clip-path="url(#cp)">${g.replace(/<text[^>]*>[^<]*<\/text>/g,"")}</g>${(g.match(/<text[^>]*>[^<]*<\/text>/g)||[]).join("")}</svg>`;
}

const T={end:null,iv:null,ring:false};
function timerLabel(){if(!T.end)return "Fokus 15 min";const r=Math.max(0,T.end-Date.now()),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);return `${m}:${String(s).padStart(2,"0")}`}
function toggleTimer(){
  if(T.end){clearInterval(T.iv);T.end=null;T.ring=false;view();return}
  T.end=Date.now()+15*60000;T.ring=false;
  T.iv=setInterval(()=>{const b=document.getElementById("tm");if(b)b.querySelector(".timer-time").textContent=timerLabel();
    if(Date.now()>=T.end){clearInterval(T.iv);T.end=null;T.ring=true;view()}},1000);
  view();
}

  app.appendChild(card);

  const nav=el("div","navrow");
  const prev=el("button","big ghost","←");prev.type="button";prev.setAttribute("aria-label","Zurück");prev.disabled=cur.i===0;prev.onclick=()=>openStep(cur.c,cur.i-1);
  const last=cur.i===ch.steps.length-1;
  next=el("button","big",last?"Kapitel abschließen →":"Weiter →");next.type="button";
  if(st.t!=="info"&&!S.done[key]){next.classList.add("ghost");next.textContent="Später machen →"}
  next.onclick=()=>{if(st.t==="info")S.done[key]=true;save();if(last){mode="done";S.pos=null;
      const nc=CH.findIndex((_,c)=>c>cur.c&&chapDone(c)<CH[c].steps.length);if(nc>=0)S.pos={c:nc,i:0};save();view();window.scrollTo(0,0)}else openStep(cur.c,cur.i+1)};
  nav.appendChild(prev);nav.appendChild(next);app.appendChild(nav);
  if(st.t==="info"&&S.done[key])card.classList.add("solved");
  app.appendChild(el("p","hint","Tipp: Mit den Pfeiltasten ← → kannst du auch blättern."));
}

function finished(){
  const ch=CH[cur.c],d=chapDone(cur.c),n=ch.steps.length,open=n-d;
  const back=el("button","tbtn","← Übersicht");back.type="button";back.onclick=()=>{mode="home";view()};
  app.appendChild(toolbar(back));
  const bn=breakBanner();if(bn)app.appendChild(bn);
  const card=el("section","card done-card");
  card.innerHTML=`<div class="done-badge pop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></div>
    <span class="eyebrow">Kapitel ${cur.c+1} geschafft</span><h2>${ch.title}</h2>
    <p class="muted">${open===0?"Alle Schritte erledigt. Sehr gut!":`${d} von ${n} Schritten erledigt. ${open} ${open===1?"Übung wartet":"Übungen warten"} noch auf dich. Du findest sie über die grauen Punkte.`}</p>
    <div class="merke"><b>Das nimmst du mit:</b><ul style="margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px">${ch.merke.map(m=>`<li>${md(m)}</li>`).join("")}</ul></div>
    <p class="muted">Gute Zeit für eine kurze Pause: aufstehen, Wasser trinken, 2 Minuten bewegen.</p>`;
  app.appendChild(card);
  const nav=el("div","navrow");
  const rev=el("button","big ghost","Kapitel ansehen");rev.type="button";rev.onclick=()=>{const i=ch.steps.findIndex((_,k)=>!S.done[sk(cur.c,k)]);openStep(cur.c,i<0?0:i)};
  nav.appendChild(rev);
  if(cur.c<CH.length-1){const nx=el("button","big",`Weiter: ${CH[cur.c+1].title} →`);nx.type="button";nx.onclick=()=>openStep(cur.c+1,0);nav.appendChild(nx)}
  else{const h=el("button","big","Zur Übersicht");h.type="button";h.onclick=()=>{mode="home";view()};nav.appendChild(h)}
  app.appendChild(nav);
}

document.addEventListener("keydown",e=>{
  if(mode!=="lesson"||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowRight"){const b=document.querySelector(".navrow .big:last-child");if(b)b.click()}
  if(e.key==="ArrowLeft"&&cur.i>0)openStep(cur.c,cur.i-1);
});

view();
</script>

</body>
</html>
